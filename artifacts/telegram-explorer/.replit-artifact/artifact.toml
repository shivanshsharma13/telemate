kind = "web"
previewPath = "/"
title = "Telegram File Explorer"
version = "1.0.0"
id = "artifacts/telegram-explorer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22064

[services.development]
run = "pnpm --filter @workspace/telegram-explorer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/telegram-explorer", "run", "build" ]
publicDir = "artifacts/telegram-explorer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22064"
BASE_PATH = "/"
